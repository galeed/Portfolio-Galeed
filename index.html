<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moustache de Chat Lab - Win98 Style</title>
    <style>
        /* --- CONFIGURACIÓN GENERAL --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #6da2d8;
            font-family: 'MS Sans Serif', 'Pixelated', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- PANTALLA DE INICIO (SPLASH SCREEN) --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; /* Fondo negro clásico de arranque */
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 1s ease-out;
        }

        .splash-logo {
            font-family: 'Arial Black', sans-serif;
            font-size: 3rem;
            color: #fff;
            text-shadow: 3px 3px 0px #d48fb3; /* Sombra rosa para combinar */
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .splash-subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #ccc;
        }

        /* Barra de carga estilo Windows 98 */
        .loading-bar-container {
            width: 300px;
            height: 20px;
            border: 2px solid #fff;
            padding: 2px;
            background-color: #000;
            display: flex;
            gap: 2px;
        }

        .loading-block {
            width: 20px;
            height: 100%;
            background-color: #000080; /* Azul de Windows */
            opacity: 0;
        }

        /* Animación de los bloques de carga */
        @keyframes loadBlock {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        .splash-options {
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #ccc;
        }

        .splash-options input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .splash-options label {
            cursor: pointer;
        }

        #skip-splash-btn {
            margin-top: 20px;
            background-color: #c0c0c0;
            border: 2px solid #fff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            padding: 8px 20px;
            font-weight: bold;
            font-family: 'MS Sans Serif', sans-serif;
            cursor: pointer;
            font-size: 14px;
        }

        #skip-splash-btn:active {
            border: 2px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
        }

        /* --- RESTO DE LA APP --- */
        .desktop {
            flex-grow: 1; padding: 20px;
            display: grid; grid-template-columns: repeat(auto-fill, 90px); gap: 20px;
            align-content: start; position: relative; z-index: 1;
        }

        .project-icon {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            cursor: pointer; color: white; text-shadow: 1px 1px 2px black;
            text-decoration: none; padding: 5px; border: 1px dotted transparent;
            user-select: none;
        }

        .project-icon.selected {
            background-color: #000080; border: 1px dotted #fff;
        }

        .project-icon span { font-size: 12px; line-height: 1.2; word-wrap: break-word; color: white; }

        .icon-emoji {
            font-size: 40px; line-height: 1; margin-bottom: 5px; 
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
        }

        .watermark-logo {
            position: absolute; bottom: 60px; right: 30px; text-align: right;
            pointer-events: none; z-index: 0; opacity: 0.8;
        }
        .watermark-logo h1 {
            color: #fff; font-size: 2rem; text-shadow: 3px 3px 0px #d48fb3;
            font-family: 'Arial Black', sans-serif; line-height: 0.9; letter-spacing: -1px;
        }
        .watermark-logo span { font-size: 0.8rem; display: block; color: #fff; text-shadow: 1px 1px 0px #d48fb3; }

        /* --- BARRA DE TAREAS --- */
        .taskbar {
            height: 40px; background-color: #f3c1d7;
            border-top: 2px solid #fff; border-bottom: 2px solid #a36d87;
            display: flex; align-items: center; padding: 0 5px;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.2); z-index: 100; position: relative;
        }

        .start-btn {
            background-color: #e6e6e6; border: 1px solid #000;
            border-top-color: #fff; border-left-color: #fff;
            border-bottom-color: #808080; border-right-color: #808080;
            padding: 5px 10px; font-weight: bold; font-size: 12px;
            display: flex; align-items: center; gap: 5px; cursor: pointer;
            height: 30px; box-shadow: inset 1px 1px 0px #dfdfdf;
            position: relative; z-index: 101;
        }
        
        .start-btn:active, .start-btn.open {
            border-top-color: #808080; border-left-color: #808080;
            border-bottom-color: #fff; border-right-color: #fff;
            padding: 6px 9px 4px 11px; background-color: #d4d4d4;
        }

        .start-btn img { width: 16px; height: 16px; }
        .divider { width: 2px; height: 20px; background: #a36d87; border-right: 1px solid #fff; margin: 0 10px; }

        .system-tray {
            margin-left: auto; display: flex; align-items: center; gap: 10px;
            font-size: 12px; color: #000; padding-right: 5px;
        }

        /* --- MENÚ DE INICIO --- */
        .start-menu {
            position: absolute; bottom: 40px; left: 5px; width: 250px;
            background-color: #c0c0c0; border: 2px solid #fff;
            border-right-color: #808080; border-bottom-color: #808080;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            display: none; flex-direction: column; z-index: 99;
        }
        .start-menu.open { display: flex; }

        .start-menu-header {
            background: linear-gradient(to bottom, #000080, #1084d0); color: white;
            padding: 10px; font-weight: bold; font-size: 18px;
            writing-mode: vertical-lr; transform: rotate(180deg);
            position: absolute; left: 0; top: 0; bottom: 0; width: 30px;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 1px 1px 0 #000;
        }

        .start-menu-list { margin-left: 30px; display: flex; flex-direction: column; padding: 2px; }

        .start-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            font-size: 12px; color: #000; text-decoration: none; cursor: pointer;
            border: 1px solid transparent;
        }
        .start-item:hover { background-color: #000080; color: white; }
        .start-item .icon-emoji { font-size: 24px; margin-bottom: 0; filter: none; }

        /* --- VENTANAS FLOTANTES (MODALES) --- */
        .window-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; background-color: #c0c0c0;
            border: 2px solid #fff; border-right-color: #808080; border-bottom-color: #808080;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            display: none; flex-direction: column; z-index: 1000;
        }
        .window-modal.active { display: flex; }

        .window-header {
            background: linear-gradient(90deg, #000080, #1084d0); color: white;
            padding: 3px 5px; display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 12px; cursor: move; user-select: none;
        }
        .window-title { display: flex; align-items: center; gap: 5px; padding-left: 2px; }
        .window-controls { display: flex; gap: 2px; }

        .win-btn {
            width: 16px; height: 14px; background-color: #c0c0c0;
            border: 1px solid #fff; border-right-color: #808080; border-bottom-color: #808080;
            display: flex; justify-content: center; align-items: center;
            font-size: 10px; font-weight: bold; cursor: pointer; color: black;
        }
        .win-btn:active { border: 1px solid #808080; border-right-color: #fff; border-bottom-color: #fff; }

        .window-content {
            padding: 20px; background-color: #fff; margin: 2px;
            border: 2px solid #808080; border-right-color: #fff; border-bottom-color: #fff;
            display: flex; flex-direction: column; gap: 15px;
        }

        .window-content h2 { font-size: 18px; color: #000080; margin-bottom: 5px; }
        .window-content p { font-size: 14px; color: #333; line-height: 1.4; }

        .action-btn {
            background-color: #c0c0c0; border: 2px solid #fff;
            border-right-color: #808080; border-bottom-color: #808080;
            padding: 8px 15px; font-weight: bold; font-size: 14px;
            cursor: pointer; text-align: center; text-decoration: none; color: black;
            display: inline-block; margin-top: 10px; align-self: flex-start;
        }
        .action-btn:active { border: 2px solid #808080; border-right-color: #fff; border-bottom-color: #fff; padding: 9px 14px 7px 16px; }

        /* Estilos Configuración */
        .config-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .config-group label { font-size: 12px; font-weight: bold; color: #000; }
        .config-group input[type="text"] {
            padding: 4px; border: 2px solid #808080; border-right-color: #fff; border-bottom-color: #fff;
            font-family: 'MS Sans Serif', sans-serif; font-size: 14px;
        }
        
        .config-toggle { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .config-toggle span { font-size: 12px; }
        
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #808080; border: 2px solid #fff; border-right-color: #808080; border-bottom-color: #808080;
            transition: .4s;
        }
        .slider:before {
            position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px;
            background-color: #c0c0c0; border: 1px solid #000; transition: .4s;
        }
        input:checked + .slider { background-color: #000080; }
        input:checked + .slider:before { transform: translateX(18px); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); display: none; z-index: 999;
        }
        .overlay.active { display: block; }

        .toast {
            position: fixed; bottom: 60px; right: 20px;
            background-color: #ffffe1; border: 1px solid #000; padding: 10px 15px;
            font-size: 12px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s;
        }
        .toast.show { display: block; opacity: 1; }

        /* Clase para ocultar el splash */
        .hidden { display: none !important; }
        .fade-out { opacity: 0; pointer-events: none; }

    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO (SPLASH) -->
    <div id="splash-screen">
        <div class="splash-logo">Moustache</div>
        <div class="splash-subtitle">de Chat Lab</div>
        
        <div class="loading-bar-container" id="loading-bar">
            <!-- Los bloques se generan con JS -->
        </div>

        <div class="splash-options">
            <input type="checkbox" id="hide-splash-checkbox">
            <label for="hide-splash-checkbox">No mostrar de nuevo al iniciar</label>
        </div>

        <button id="skip-splash-btn">Saltar Inicio</button>
    </div>

    <!-- ZONA DE ESCRITORIO -->
    <main class="desktop" id="desktop"></main>

    <!-- LOGO FLOTANTE -->
    <div class="watermark-logo">
        <h1>Moustache</h1>
        <span>de Chat Lab</span>
    </div>

    <!-- MENÚ DE INICIO -->
    <div class="start-menu" id="start-menu">
        <div class="start-menu-header">Moustache</div>
        <div class="start-menu-list" id="start-menu-list"></div>
    </div>

    <!-- BARRA DE TAREAS -->
    <footer class="taskbar">
        <button class="start-btn" id="start-btn">
            <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" alt="Start">
            Inicio
        </button>
        <div class="divider"></div>
        <div id="taskbar-status" style="font-size: 11px; color: #555;"></div>
        <div class="system-tray">
            <span id="user-display" style="font-weight: bold; margin-right: 5px;"></span>
            <span>🔊</span>
            <span>🌐</span>
            <span id="clock">--:--</span>
        </div>
    </footer>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay"></div>

    <!-- VENTANA MODAL (Proyectos) -->
    <div class="window-modal" id="project-window">
        <div class="window-header" id="window-header">
            <div class="window-title">
                <span id="modal-icon">📁</span>
                <span id="modal-title">Título</span>
            </div>
            <div class="window-controls">
                <div class="win-btn" id="close-btn">X</div>
            </div>
        </div>
        <div class="window-content">
            <h2 id="modal-heading">Nombre</h2>
            <p id="modal-desc">Descripción...</p>
            <a href="#" target="_blank" class="action-btn" id="modal-link">↗ Abrir App</a>
        </div>
    </div>

    <!-- VENTANA DE CONFIGURACIÓN -->
    <div class="window-modal" id="config-window" style="width: 350px;">
        <div class="window-header" id="config-header">
            <div class="window-title">
                <span>⚙️</span>
                <span>Configuración</span>
            </div>
            <div class="window-controls">
                <div class="win-btn" id="close-config">X</div>
            </div>
        </div>
        <div class="window-content">
            <h2>Panel de Control</h2>
            
            <div class="config-group">
                <label for="username-input">Nombre de Usuario:</label>
                <input type="text" id="username-input" placeholder="Escribe tu nombre...">
            </div>

            <div class="config-group">
                <label>Modo de Trabajo:</label>
                <div class="config-toggle">
                    <label class="switch">
                        <input type="checkbox" id="online-toggle" checked>
                        <span class="slider"></span>
                    </label>
                    <span id="online-status-text">Online 🌐</span>
                </div>
            </div>

            <!-- Opción para reactivar la animación de inicio -->
            <div class="config-group" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
                <label>Pantalla de Inicio:</label>
                <div class="config-toggle">
                    <label class="switch">
                        <input type="checkbox" id="splash-toggle">
                        <span class="slider"></span>
                    </label>
                    <span id="splash-status-text">Ocultar Animación</span>
                </div>
            </div>

            <div class="config-group" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
                <button class="action-btn" id="btn-clear-cache" style="align-self: stretch; background-color: #e6e6e6;">🗑️ Actualizar Caché</button>
                <p style="font-size: 10px; color: #666; margin-top: 5px;">Borra los datos almacenados localmente y recarga la página.</p>
            </div>

            <button class="action-btn" id="btn-save-config" style="background-color: #d4d4d4; align-self: stretch; margin-top: 10px;">💾 Guardar Cambios</button>
        </div>
    </div>

    <!-- TOAST NOTIFICACIÓN -->
    <div class="toast" id="toast">Mensaje</div>

    <script>
        // --- DATOS DE TUS PROYECTOS ---
        const projects = [
            { id: 1, name: "Audio Michi App", desc: "Herramienta de audio 100% local en el navegador.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "🎧" },
            { id: 2, name: "Miaulement Conversor", desc: "Conversor de formatos de audio.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "🎼" },
            { id: 3, name: "Video Michi App", desc: "Editor y procesador de video local.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "🎥" },
            { id: 4, name: "Moustache Mastering", desc: "Herramienta de masterización de audio.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "🎵" },
            { id: 5, name: "S Canvas Generator", desc: "Generador de gráficos y canvas.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "🖼️" },
            { id: 6, name: "Meow Espectograma", desc: "Visualizador de espectrograma de audio.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "📊" },
            { id: 7, name: "Reproductor Online", desc: "Reproductor de música en línea.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "▶️" },
            { id: 8, name: "Michi Red Book", desc: "Mastering estilo Red Book.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "💿" },
            { id: 9, name: "HTML App", desc: "Aplicación web genérica.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "🌐" },
            { id: 10, name: "MusicApp", desc: "Reproducción y almacenamiento online (Requiere registro).", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "🎶" },
            { id: 11, name: "Michi Loudness", desc: "Medidor de loudness y análisis.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "🔊" },
            { id: 12, name: "Libreta de Notas", desc: "Bloc de notas rápido.", url: "https://galeed.github.io/Moustache-de-Chat-Lab/", icon: "📓" }
        ];

        // Referencias DOM
        const splashScreen = document.getElementById('splash-screen');
        const loadingBar = document.getElementById('loading-bar');
        const hideSplashCheckbox = document.getElementById('hide-splash-checkbox');
        const skipSplashBtn = document.getElementById('skip-splash-btn');
        
        const desktop = document.getElementById('desktop');
        const startMenuList = document.getElementById('start-menu-list');
        const startBtn = document.getElementById('start-btn');
        const startMenu = document.getElementById('start-menu');
        const modal = document.getElementById('project-window');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('close-btn');
        const modalTitle = document.getElementById('modal-title');
        const modalHeading = document.getElementById('modal-heading');
        const modalDesc = document.getElementById('modal-desc');
        const modalLink = document.getElementById('modal-link');
        const modalIcon = document.getElementById('modal-icon');
        const taskbarStatus = document.getElementById('taskbar-status');
        
        const configWindow = document.getElementById('config-window');
        const closeConfig = document.getElementById('close-config');
        const configHeader = document.getElementById('config-header');
        const usernameInput = document.getElementById('username-input');
        const onlineToggle = document.getElementById('online-toggle');
        const onlineStatusText = document.getElementById('online-status-text');
        const splashToggle = document.getElementById('splash-toggle');
        const splashStatusText = document.getElementById('splash-status-text');
        const userDisplay = document.getElementById('user-display');
        const btnSaveConfig = document.getElementById('btn-save-config');
        const btnClearCache = document.getElementById('btn-clear-cache');
        const toast = document.getElementById('toast');

        let selectedIcon = null;

        // --- LÓGICA DE LA PANTALLA DE INICIO ---
        function initSplash() {
            // Comprobar si el usuario decidió ocultarlo
            const hideSplash = localStorage.getItem('moustache_hide_splash') === 'true';
            
            if (hideSplash) {
                splashScreen.classList.add('hidden');
                return; // No ejecutamos la animación
            }

            // Crear los bloques de la barra de carga
            for (let i = 0; i < 10; i++) {
                const block = document.createElement('div');
                block.className = 'loading-block';
                // Asignar un retraso de animación escalonado
                block.style.animation = `loadBlock 1.5s infinite ${i * 0.15}s`;
                loadingBar.appendChild(block);
            }

            // Tiempo de duración de la animación (4 segundos)
            const splashTimeout = setTimeout(() => {
                finishSplash();
            }, 4000);

            // Función para terminar el splash
            function finishSplash() {
                clearTimeout(splashTimeout);
                splashScreen.classList.add('fade-out');
                setTimeout(() => {
                    splashScreen.classList.add('hidden');
                }, 1000); // Esperar a que termine la transición
            }

            // Botón de saltar
            skipSplashBtn.addEventListener('click', finishSplash);

            // Guardar preferencia si marca la casilla
            hideSplashCheckbox.addEventListener('change', (e) => {
                localStorage.setItem('moustache_hide_splash', e.target.checked);
            });
        }

        // --- 1. GENERAR ICONOS EN EL ESCRITORIO ---
        function createDesktopIcons() {
            const configDiv = document.createElement('div');
            configDiv.className = 'project-icon';
            configDiv.innerHTML = `<div class="icon-emoji">⚙️</div><span>Configuración</span>`;
            configDiv.addEventListener('click', (e) => { e.stopPropagation(); selectIcon(configDiv); });
            configDiv.addEventListener('dblclick', () => openConfig());
            desktop.appendChild(configDiv);

            projects.forEach(project => {
                const div = document.createElement('div');
                div.className = 'project-icon';
                div.innerHTML = `<div class="icon-emoji">${project.icon}</div><span>${project.name}</span>`;
                div.addEventListener('click', (e) => { e.stopPropagation(); selectIcon(div); });
                div.addEventListener('dblclick', () => openWindow(project));
                desktop.appendChild(div);
            });
        }

        // --- 2. GENERAR EL MENÚ DE INICIO ---
        projects.forEach(project => {
            const item = document.createElement('div');
            item.className = 'start-item';
            item.innerHTML = `<div class="icon-emoji">${project.icon}</div><span>${project.name}</span>`;
            item.addEventListener('click', () => { openWindow(project); closeStartMenu(); });
            startMenuList.appendChild(item);
        });

        // --- 3. LÓGICA DE SELECCIÓN ---
        function selectIcon(iconElement) {
            if (selectedIcon) selectedIcon.classList.remove('selected');
            iconElement.classList.add('selected');
            selectedIcon = iconElement;
        }

        desktop.addEventListener('click', () => {
            if (selectedIcon) { selectedIcon.classList.remove('selected'); selectedIcon = null; }
        });

        // --- 4. LÓGICA DEL MENÚ DE INICIO ---
        function toggleStartMenu() {
            startMenu.classList.toggle('open');
            startBtn.classList.toggle('open');
        }
        function closeStartMenu() {
            startMenu.classList.remove('open');
            startBtn.classList.remove('open');
        }

        startBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleStartMenu(); });
        document.addEventListener('click', (e) => {
            if (!startMenu.contains(e.target) && !startBtn.contains(e.target)) closeStartMenu();
        });

        // --- 5. VENTANA DE PROYECTOS ---
        function openWindow(project) {
            modalTitle.textContent = project.name + " - Moustache Lab";
            modalHeading.textContent = project.name;
            modalDesc.textContent = project.desc;
            modalLink.href = project.url;
            modalIcon.textContent = project.icon;
            
            modal.classList.add('active');
            overlay.classList.add('active');
            taskbarStatus.textContent = "Abierto: " + project.name;
            
            modal.style.top = '50%'; modal.style.left = '50%'; modal.style.transform = 'translate(-50%, -50%)';
        }

        function closeWindow() {
            modal.classList.remove('active');
            overlay.classList.remove('active');
            taskbarStatus.textContent = "";
        }
        closeBtn.addEventListener('click', closeWindow);

        // --- 6. VENTANA DE CONFIGURACIÓN ---
        function openConfig() {
            const savedUser = localStorage.getItem('moustache_username') || '';
            const isOnline = localStorage.getItem('moustache_online') !== 'false';
            const hideSplash = localStorage.getItem('moustache_hide_splash') === 'true';
            
            usernameInput.value = savedUser;
            onlineToggle.checked = isOnline;
            updateOnlineUI(isOnline);
            
            splashToggle.checked = hideSplash;
            updateSplashUI(hideSplash);

            configWindow.classList.add('active');
            overlay.classList.add('active');
            taskbarStatus.textContent = "Configuración abierta";
            
            configWindow.style.top = '50%'; configWindow.style.left = '50%'; configWindow.style.transform = 'translate(-50%, -50%)';
        }

        function closeConfigWindow() {
            configWindow.classList.remove('active');
            overlay.classList.remove('active');
            taskbarStatus.textContent = "";
        }
        closeConfig.addEventListener('click', closeConfigWindow);
        overlay.addEventListener('click', () => { closeWindow(); closeConfigWindow(); });

        function updateOnlineUI(isOnline) {
            onlineStatusText.textContent = isOnline ? "Online 🌐" : "Offline 📴";
            onlineStatusText.style.color = isOnline ? "#000080" : "#800000";
        }

        function updateSplashUI(isHidden) {
            splashStatusText.textContent = isHidden ? "Animación Desactivada" : "Animación Activada";
            splashStatusText.style.color = isHidden ? "#800000" : "#000080";
        }

        onlineToggle.addEventListener('change', (e) => updateOnlineUI(e.target.checked));
        splashToggle.addEventListener('change', (e) => updateSplashUI(e.target.checked));

        btnSaveConfig.addEventListener('click', () => {
            const newName = usernameInput.value.trim();
            const isOnline = onlineToggle.checked;
            const hideSplash = splashToggle.checked;

            localStorage.setItem('moustache_username', newName);
            localStorage.setItem('moustache_online', isOnline);
            localStorage.setItem('moustache_hide_splash', hideSplash);

            userDisplay.textContent = newName ? `👤 ${newName}` : '';
            
            showToast("✅ Configuración guardada correctamente.");
        });

        btnClearCache.addEventListener('click', async () => {
            if(confirm("¿Estás seguro de que quieres borrar los datos locales y actualizar la caché? Se recargará la página.")) {
                localStorage.clear();
                if ('caches' in window) {
                    try {
                        const cacheNames = await caches.keys();
                        await Promise.all(cacheNames.map(name => caches.delete(name)));
                    } catch (err) { console.log("Error borrando cache:", err); }
                }
                showToast("🔄 Caché borrada. Recargando...");
                setTimeout(() => { location.reload(); }, 1500);
            }
        });

        // --- 7. ARRASTRAR VENTANAS ---
        function makeDraggable(header, windowElement) {
            let isDragging = false;
            let offsetX, offsetY;

            header.addEventListener('mousedown', (e) => {
                isDragging = true;
                const rect = windowElement.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                
                windowElement.style.transform = 'none';
                windowElement.style.left = rect.left + 'px';
                windowElement.style.top = rect.top + 'px';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let newX = e.clientX - offsetX;
                let newY = e.clientY - offsetY;
                const maxX = window.innerWidth - windowElement.offsetWidth;
                const maxY = window.innerHeight - windowElement.offsetHeight - 40;
                if (newX < 0) newX = 0;
                if (newY < 0) newY = 0;
                if (newX > maxX) newX = maxX;
                if (newY > maxY) newY = maxY;
                windowElement.style.left = newX + 'px';
                windowElement.style.top = newY + 'px';
            });

            document.addEventListener('mouseup', () => { isDragging = false; });
        }

        makeDraggable(document.getElementById('window-header'), modal);
        makeDraggable(configHeader, configWindow);

        // --- 8. TOAST ---
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // --- 9. RELOJ Y CARGA INICIAL ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = hours + ':' + minutes + ' ' + ampm;
        }
        
        // --- INICIALIZACIÓN ---
        initSplash(); // Llama a la animación primero
        createDesktopIcons();
        
        setInterval(updateClock, 1000);
        updateClock();

        const savedUserInit = localStorage.getItem('moustache_username');
        if (savedUserInit) { userDisplay.textContent = `👤 ${savedUserInit}`; }

    </script>
</body>
</html>
